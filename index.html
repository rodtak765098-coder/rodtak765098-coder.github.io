<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейро-Игры | Каталог</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #0a0f1a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen selection:bg-cyan-500/30">

    <!-- Шапка сайта -->
    <header class="sticky top-0 z-50 bg-[#0a0f1a]/80 backdrop-blur-md border-b border-white/5 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between py-4 gap-4">
                
                <!-- Логотип -->
                <div class="flex items-center gap-2 text-2xl font-bold tracking-tight text-white w-full md:w-auto">
                    <svg class="w-8 h-8 text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                        Нейро-Игры
                    </span>
                </div>

                <!-- Поиск -->
                <div class="relative w-full md:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="Поиск игр..." class="block w-full pl-10 pr-3 py-2.5 border border-slate-700/50 rounded-xl leading-5 bg-slate-800/50 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all shadow-inner">
                </div>
            </div>
            
            <!-- Категории -->
            <div id="categories" class="flex overflow-x-auto py-3 gap-2 no-scrollbar border-t border-white/5 md:border-none md:pt-0">
                <!-- Кнопки добавятся через JS -->
            </div>
        </div>
    </header>

    <!-- Сетка с играми -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Карточки добавятся через JS -->
        </div>
    </main>

    <script>
        // ТА САМАЯ БАЗА ДАННЫХ ИГР (Сюда будешь добавлять новые игры)
        const games =[
            {
                id: 'game4',
                title: 'Cube Dash',
                category: 'Аркады',
                image: 'https://picsum.photos/seed/cubedash/600/400?blur=1',
                link: 'cubedash.html', // <--- Ссылка на нашу рабочуую игру!
                description: 'Ритмичная аркада, где каждое ваше движение должно совпадать с битом музыки.'
            },
            {
                id: 'game1',
                title: 'Neon Rider',
                category: 'Аркады',
                image: 'https://picsum.photos/seed/neonrider/600/400?blur=1',
                link: '#',
                description: 'Мчитесь по неоновым трассам на огромной скорости. Избегайте препятствий.'
            },
            {
                id: 'game3',
                title: 'Space Shooter',
                category: 'Экшен',
                image: 'https://picsum.photos/seed/spaceshooter/600/400?blur=1',
                link: '#',
                description: 'Защитите галактику от вторжения инопланетных захватчиков.'
            }
        ];

        // Логика работы сайта (Поиск и Фильтры)
        const categories =['Все', 'Аркады', 'Головоломки', 'Экшен'];
        let activeCategory = 'Все';
        let searchQuery = '';

        const grid = document.getElementById('games-grid');
        const categoriesContainer = document.getElementById('categories');
        const searchInput = document.getElementById('searchInput');

        function renderCategories() {
            categoriesContainer.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-5 py-2 rounded-xl text-sm font-medium transition-all duration-300 ${activeCategory === cat ? 'bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(34,211,238,0.5)] scale-105' : 'bg-slate-800/50 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/50'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderGames() {
            const filtered = games.filter(g => {
                const matchCat = activeCategory === 'Все' || g.category === activeCategory;
                const matchSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-24 text-center text-slate-400">Ничего не найдено</div>`;
                return;
            }

            grid.innerHTML = filtered.map(g => `
                <a href="${g.link}" class="group block bg-slate-800/40 rounded-2xl overflow-hidden border border-slate-700/50 transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_0_25px_rgba(34,211,238,0.25)] hover:border-cyan-500/40 hover:bg-slate-800/60 backdrop-blur-sm">
                    <div class="relative aspect-[4/3] overflow-hidden bg-slate-900">
                        <img src="${g.image}" alt="${g.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0f1a] via-[#0a0f1a]/40 to-transparent opacity-90"></div>
                        <div class="absolute bottom-4 left-4">
                            <span class="px-3 py-1.5 text-xs font-semibold bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 rounded-lg backdrop-blur-md shadow-[0_0_10px_rgba(34,211,238,0.1)]">
                                ${g.category}
                            </span>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-xl font-bold text-white group-hover:text-cyan-400 transition-colors drop-shadow-sm">${g.title}</h3>
                        <p class="mt-2 text-sm text-slate-400 line-clamp-2 leading-relaxed">${g.description}</p>
                    </div>
                </a>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderGames();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGames();
        });

        // Инициализация при загрузке
        renderCategories();
        renderGames();
    </script>
</body>
</html>
